<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Vitamina D — Botánica Andina</title>
    <meta name="description" content="Calcula tu necesidad diaria de vitamina D según edad, tipo de piel y ubicación en LATAM.">
    <meta name="robots" content="noindex,follow">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            line-height:1.6;
            color:#2c3e50;
            background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            min-height:100vh;
            padding:20px;
        }
        .container{
            max-width:600px;
            margin:0 auto;
            background:#fff;
            border-radius:16px;
            box-shadow:0 20px 60px rgba(0,0,0,0.2);
            overflow:hidden;
        }
        .header{
            background:#667eea;
            color:#fff;
            padding:1.5rem 2rem;
            text-align:center;
        }
        .header h1{
            font-size:1.5rem;
            margin:0;
            font-weight:700;
        }
        .header p{
            font-size:0.9rem;
            opacity:0.9;
            margin:0.5rem 0 0;
        }
        .body{
            padding:2rem;
        }
        .form-group{
            margin-bottom:1.5rem;
        }
        .form-group label{
            display:block;
            font-weight:600;
            margin-bottom:0.5rem;
            color:#2c3e50;
        }
        .form-group select,.form-group input{
            width:100%;
            padding:0.75rem 1rem;
            border:2px solid #e2e8f0;
            border-radius:8px;
            font-size:1rem;
            font-family:inherit;
            background:#fff;
        }
        .form-group select:focus,.form-group input:focus{
            outline:none;
            border-color:#667eea;
            box-shadow:0 0 0 3px rgba(102,126,234,0.1);
        }
        .calculate-btn{
            width:100%;
            padding:1rem;
            background:#667eea;
            color:#fff;
            border:none;
            border-radius:8px;
            font-size:1.1rem;
            font-weight:600;
            cursor:pointer;
            margin-top:1rem;
            transition:background 0.3s;
        }
        .calculate-btn:hover{
            background:#5568d3;
        }
        .result-box{
            background:#f8fafc;
            border:1px solid #e2e8f0;
            border-radius:12px;
            padding:1.5rem;
            margin-top:2rem;
        }
        .result-row{
            display:flex;
            justify-content:space-between;
            padding:0.75rem 0;
            border-bottom:1px solid #f1f5f9;
        }
        .result-row:last-child{
            border-bottom:none;
        }
        .result-row.highlight{
            background:#fef3c7;
            margin:0 -1.5rem;
            padding:0.75rem 1.5rem;
            border-radius:8px;
            border:none;
        }
        .label{
            color:#64748b;
            font-weight:500;
        }
        .value{
            font-weight:700;
            color:#667eea;
        }
        .chart-container{
            background:#f1f5f9;
            border-radius:8px;
            padding:1rem;
            margin-top:1.5rem;
        }
        .chart-label{
            text-align:center;
            font-size:0.85rem;
            color:#64748b;
            margin-top:0.75rem;
        }
        .chart-bar{
            height:24px;
            background:#e5e7eb;
            border-radius:4px;
            overflow:hidden;
            position:relative;
        }
        .chart-fill{
            height:100%;
            background:linear-gradient(90deg,#667eea 0%,#764ba2 100%);
            width:0%;
            transition:width 0.5s ease;
        }
        .footer{
            background:#f8fafc;
            padding:1rem 2rem;
            text-align:center;
            font-size:0.8rem;
            color:#64748b;
            border-top:1px solid #e2e8f0;
        }
        .footer a{
            color:#667eea;
            text-decoration:none;
            font-weight:600;
        }
        .footer a:hover{
            text-decoration:underline;
        }
        .info{
            display:flex;
            align-items:center;
            gap:0.5rem;
            font-size:0.8rem;
            color:#64748b;
            margin-top:1rem;
            padding:0.75rem;
            background:#fffbeb;
            border-radius:6px;
        }
        .emoji{
            font-size:1.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>☀ Calculadora de Vitamina D</h1>
            <p>Descubre tu necesidad diaria según tu edad, piel y ubicación</p>
        </div>
        <div class="body">
            <div class="form-group">
                <label for="age">Grupo de edad</label>
                <select id="age">
                    <option value="0-1">0-1 años (400 UI base)</option>
                    <option value="1-18">1-18 años (400 UI base)</option>
                    <option value="19-50" selected>19-50 años (600 UI base)</option>
                    <option value="51-70">51-70 años (600 UI base)</option>
                    <option value="70+">70+ años (800 UI base)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="skin">Tipo de piel</label>
                <select id="skin">
                    <option value="1">Muy clara (piel clara) — Factor 3.0x</option>
                    <option value="2">Clara (piel muy clara) — Factor 2.5x</option>
                    <option value="3" selected>Media (piel media) — Factor 1.5x</option>
                    <option value="4">Oscura (piel oscura) — Factor 1.0x</option>
                    <option value="5">Muy oscura (piel negra) — Factor 0.5x</option>
                </select>
            </div>
            <div class="form-group">
                <label for="location">Ubicación en LATAM</label>
                <select id="location">
                    <option value="lima" selected>Lima, Perú (UVB: 7.2)</option>
                    <option value="bogota">Bogotá, Colombia (UVB: 6.8)</option>
                    <option value="quito">Quito, Ecuador (UVB: 7.5)</option>
                    <option value="santiago">Santiago, Chile (UVB: 5.5)</option>
                    <option value="buenos_aires">Buenos Aires, Argentina (UVB: 5.0)</option>
                    <option value="caracas">Caracas, Venezuela (UVB: 7.8)</option>
                    <option value="la_paz">La Paz, Bolivia (UVB: 7.0)</option>
                    <option value="montevideo">Montevideo, Uruguay (UVB: 4.8)</option>
                    <option value="asuncion">Asunción, Paraguay (UVB: 6.5)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="time">Tiempo de exposición al sol (minutos/día)</label>
                <input type="number" id="time" min="0" max="180" value="30" placeholder="30">
            </div>
            <button class="calculate-btn" onclick="calculate()">Calcular necesidad</button>
            <div class="info">
                <span class="emoji">ℹ️</span>
                <span>Basado en Institute of Medicine (2011) + UVB por ciudad</span>
            </div>
        </div>
        <div id="result" class="result-box" style="display:none;"></div>
        <div class="chart-container">
            <div class="chart-label">Síntesis solar vs Necesidad</div>
            <div class="chart-bar">
                <div class="chart-fill" id="chart"></div>
            </div>
        </div>
    </div>
    <div class="footer">
        Herramienta gratuita de <a href="https://botanicaandina.com/herramientas/" target="_blank" rel="noopener">Botánica Andina</a>
        &mdash; <a href="https://botanicaandina.com/herramientas/calc-vitamina-d.html" target="_blank" rel="noopener">Versión completa</a>
    </div>
</div>
<script>

    const SKIN_TYPES = {"1": {"name": "Muy clara (piel clara)", "factor": 3.0, "label": "Clara"}, "2": {"name": "Clara (piel clara)", "factor": 2.5, "label": "Muy clara"}, "3": {"name": "Media (piel media)", "factor": 1.5, "label": "Media"}, "4": {"name": "Oscura (piel oscura)", "factor": 1.0, "label": "Oscura"}, "5": {"name": "Muy oscura (piel negra)", "factor": 0.5, "label": "Muy oscura"}};
    const LOCATIONS = {"lima": {"name": "Lima, Perú", "latitude": -12.0464, "uvb": 7.2}, "bogota": {"name": "Bogotá, Colombia", "latitude": 4.711, "uvb": 6.8}, "quito": {"name": "Quito, Ecuador", "latitude": -0.1807, "uvb": 7.5}, "santiago": {"name": "Santiago, Chile", "latitude": -33.4489, "uvb": 5.5}, "buenos_aires": {"name": "Buenos Aires, Argentina", "latitude": -34.6037, "uvb": 5.0}, "caracas": {"name": "Caracas, Venezuela", "latitude": 10.4806, "uvb": 7.8}, "la_paz": {"name": "La Paz, Bolivia", "latitude": -16.5, "uvb": 7.0}, "montevideo": {"name": "Montevideo, Uruguay", "latitude": -34.9011, "uvb": 4.8}, "asuncion": {"name": "Asunción, Paraguay", "latitude": -25.2637, "uvb": 6.5}};
    const AGE_NEEDS = {"0-1": 400, "1-18": 400, "19-50": 600, "51-70": 600, "70+": 800};

    function calculate() {
        const ageGroup = document.getElementById('age').value;
        const skinType = document.getElementById('skin').value;
        const location = document.getElementById('location').value;
        const timeSun = parseInt(document.getElementById('time').value) || 0;

        const baseNeed = AGE_NEEDS[ageGroup];
        const locationData = LOCATIONS[location];
        const skinFactor = SKIN_TYPES[skinType].factor;
        const uvb = locationData.uvb || 7.0;

        const sunIU = Math.min((timeSun * uvb * skinFactor) / 10, 10000);
        const netNeed = Math.max(baseNeed - sunIU, 0);

        const dose = getDoseText(netNeed);

        document.getElementById('result').innerHTML = formatResult(baseNeed, sunIU, netNeed, dose.text, locationData.name);
        document.getElementById('chart').style.width = Math.min((sunIU / baseNeed) * 100, 100) + '%';
    }

    function getDoseText(netNeed) {
        if (netNeed <= 0) return { amount: 0, text: 'No necesitas suplemento' };
        if (netNeed <= 400) return { amount: 400, text: '400 UI (1 cápsula)' };
        if (netNeed <= 800) return { amount: 800, text: '800 UI (2 cápsulas)' };
        if (netNeed <= 1200) return { amount: 1200, text: '1,200 UI (3 cápsulas)' };
        return { amount: 2000, text: '2,000 UI (consultar médico)' };
    }

    function formatResult(base, sun, net, doseText, locName) {
        const sunPercent = Math.round((sun / base) * 100);
        return `
            <div class="result-box">
                <div class="result-row">
                    <span class="label">Necesidad base:</span>
                    <span class="value">${base} UI</span>
                </div>
                <div class="result-row">
                    <span class="label">Síntesis solar (${locName}):</span>
                    <span class="value">${sun} UI</span>
                </div>
                <div class="result-row highlight">
                    <span class="label">Necesidad neta:</span>
                    <span class="value">${net} UI</span>
                </div>
                <div class="result-row highlight">
                    <span class="label">Dosis recomendada:</span>
                    <span class="value">${doseText}</span>
                </div>
                <div class="chart-label">Síntesis solar: ${sunPercent}%</div>
            </div>
        `;
    }

    document.addEventListener('DOMContentLoaded', function() {
        const inputs = ['age', 'skin', 'location', 'time'];
        inputs.forEach(id => {
            document.getElementById(id).addEventListener('change', calculate);
        });
        calculate();
    });
    
</script>
</body>
</html>
