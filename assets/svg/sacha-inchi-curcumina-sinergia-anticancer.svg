<svg viewBox="0 0 570 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Estrategia de sinergia anticancerigena" style="max-width:570px;width:100%;height:auto;margin:1.5rem auto;display:block;">
    <text x="20" y="30" fill="#222" font-size="15" font-family="Arial,sans-serif" font-weight="bold">Estrategia de sinergia anticancerigena</text>
    
        <rect x="20" y="50" width="110" height="80" rx="10" fill="#1565c0"/>
        <text x="75" y="72" fill="rgba(255,255,255,0.5)" font-size="28" font-family="Arial,sans-serif" font-weight="900" text-anchor="middle">1</text>
        <text x="75" y="95" fill="#fff" font-size="12" font-family="Arial,sans-serif" font-weight="600" text-anchor="middle">Parasporina</text><text x="75" y="111" fill="#fff" font-size="12" font-family="Arial,sans-serif" font-weight="600" text-anchor="middle">modificada</text><text x="135" y="95" fill="#999" font-size="20" font-family="Arial,sans-serif" text-anchor="middle">&#8594;</text>
        <rect x="160" y="50" width="110" height="80" rx="10" fill="#e65100"/>
        <text x="215" y="72" fill="rgba(255,255,255,0.5)" font-size="28" font-family="Arial,sans-serif" font-weight="900" text-anchor="middle">2</text>
        <text x="215" y="95" fill="#fff" font-size="12" font-family="Arial,sans-serif" font-weight="600" text-anchor="middle">Curcumina</text><text x="215" y="111" fill="#fff" font-size="12" font-family="Arial,sans-serif" font-weight="600" text-anchor="middle">(sinergia)</text><text x="275" y="95" fill="#999" font-size="20" font-family="Arial,sans-serif" text-anchor="middle">&#8594;</text>
        <rect x="300" y="50" width="110" height="80" rx="10" fill="#c62828"/>
        <text x="355" y="72" fill="rgba(255,255,255,0.5)" font-size="28" font-family="Arial,sans-serif" font-weight="900" text-anchor="middle">3</text>
        <text x="355" y="95" fill="#fff" font-size="12" font-family="Arial,sans-serif" font-weight="600" text-anchor="middle">Apoptosis</text><text x="355" y="111" fill="#fff" font-size="12" font-family="Arial,sans-serif" font-weight="600" text-anchor="middle">(caspasas 3,7,9)</text><text x="415" y="95" fill="#999" font-size="20" font-family="Arial,sans-serif" text-anchor="middle">&#8594;</text>
        <rect x="440" y="50" width="110" height="80" rx="10" fill="#2e7d32"/>
        <text x="495" y="72" fill="rgba(255,255,255,0.5)" font-size="28" font-family="Arial,sans-serif" font-weight="900" text-anchor="middle">4</text>
        <text x="495" y="95" fill="#fff" font-size="12" font-family="Arial,sans-serif" font-weight="600" text-anchor="middle">Cancer cervical</text><text x="495" y="111" fill="#fff" font-size="12" font-family="Arial,sans-serif" font-weight="600" text-anchor="middle">eliminado</text>
</svg>