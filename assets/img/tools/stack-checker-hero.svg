<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1024 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stack Checker - Verificador de compatibilidad de suplementos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#e8dcc8"/>
    </linearGradient>
    <linearGradient id="leaf1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d4f"/>
      <stop offset="100%" stop-color="#1a5632"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d4f"/>
    </linearGradient>
    <linearGradient id="capsule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="50%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#c4956a"/>
    </linearGradient>
    <linearGradient id="capsule2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8bc34a"/>
      <stop offset="50%" stop-color="#689f38"/>
      <stop offset="100%" stop-color="#558b2f"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="320" fill="url(#bg)"/>

  <!-- Subtle paper texture lines -->
  <g opacity="0.06">
    <line x1="0" y1="40" x2="1024" y2="40" stroke="#8b7355" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="1024" y2="80" stroke="#8b7355" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="1024" y2="120" stroke="#8b7355" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="1024" y2="160" stroke="#8b7355" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1024" y2="200" stroke="#8b7355" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1024" y2="240" stroke="#8b7355" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="1024" y2="280" stroke="#8b7355" stroke-width="0.5"/>
  </g>

  <!-- Left: Botanical leaf arrangement -->
  <g transform="translate(80, 60)" filter="url(#shadow)">
    <!-- Large leaf -->
    <path d="M60,220 Q30,160 20,100 Q15,60 40,30 Q60,5 80,20 Q100,35 95,70 Q90,120 80,180 Z" fill="url(#leaf1)" opacity="0.9"/>
    <path d="M60,220 Q55,150 50,90 Q48,50 60,25" stroke="#1a5632" stroke-width="1.5" fill="none" opacity="0.6"/>
    <!-- Leaf veins -->
    <path d="M50,90 Q65,85 75,75" stroke="#1a5632" stroke-width="0.8" fill="none" opacity="0.4"/>
    <path d="M52,120 Q68,115 82,100" stroke="#1a5632" stroke-width="0.8" fill="none" opacity="0.4"/>
    <path d="M55,150 Q70,145 80,135" stroke="#1a5632" stroke-width="0.8" fill="none" opacity="0.4"/>

    <!-- Smaller leaf -->
    <path d="M110,200 Q95,155 100,110 Q105,80 120,65 Q135,55 140,70 Q145,90 135,130 Q125,170 115,195 Z" fill="url(#leaf2)" opacity="0.8"/>
    <path d="M110,200 Q105,155 110,110 Q112,85 120,65" stroke="#2e7d4f" stroke-width="1" fill="none" opacity="0.5"/>

    <!-- Small accent leaf -->
    <path d="M30,195 Q10,170 15,140 Q20,120 35,115 Q48,115 45,135 Q40,165 35,190 Z" fill="#4caf50" opacity="0.6"/>
  </g>

  <!-- Center: Supplement capsules -->
  <g transform="translate(300, 80)" filter="url(#shadow)">
    <!-- Capsule 1 -->
    <rect x="0" y="30" width="28" height="70" rx="14" fill="url(#capsule)"/>
    <rect x="0" y="30" width="28" height="35" rx="14" fill="#d4a574"/>
    <ellipse cx="14" cy="65" rx="14" ry="3" fill="#c4956a" opacity="0.3"/>

    <!-- Capsule 2 -->
    <rect x="50" y="10" width="28" height="70" rx="14" fill="url(#capsule2)"/>
    <rect x="50" y="10" width="28" height="35" rx="14" fill="#689f38"/>
    <ellipse cx="64" cy="45" rx="14" ry="3" fill="#558b2f" opacity="0.3"/>

    <!-- Capsule 3 -->
    <rect x="100" y="45" width="28" height="70" rx="14" fill="#e8b86d"/>
    <rect x="100" y="45" width="28" height="35" rx="14" fill="#d4a040"/>

    <!-- Interaction arrows -->
    <g opacity="0.5">
      <path d="M30,60 Q40,55 48,45" stroke="#c62828" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
      <path d="M80,40 Q90,50 98,60" stroke="#2e7d4f" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
    </g>

    <!-- Check/warning symbols -->
    <circle cx="40" cy="130" r="12" fill="#2e7d4f" opacity="0.9"/>
    <path d="M34,130 L38,134 L46,126" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <circle cx="90" cy="130" r="12" fill="#e65100" opacity="0.9"/>
    <text x="90" y="135" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold" font-family="serif">!</text>
  </g>

  <!-- Right: Decorative botanical elements -->
  <g transform="translate(780, 40)" opacity="0.7">
    <!-- Flower/herb sprig -->
    <path d="M40,240 Q38,200 35,160 Q32,120 40,80 Q45,50 50,30" stroke="#8b7355" stroke-width="1.5" fill="none"/>
    <!-- Small leaves on stem -->
    <path d="M40,180 Q25,170 20,155 Q18,145 28,148 Q38,152 40,165" fill="#4caf50" opacity="0.6"/>
    <path d="M40,140 Q55,130 60,115 Q62,105 52,108 Q42,112 40,125" fill="#2e7d4f" opacity="0.6"/>
    <path d="M40,100 Q25,90 20,75 Q18,65 28,68 Q38,72 40,85" fill="#4caf50" opacity="0.5"/>
    <!-- Small berries/flowers at top -->
    <circle cx="50" cy="30" r="6" fill="#c62828" opacity="0.5"/>
    <circle cx="42" cy="22" r="5" fill="#e65100" opacity="0.4"/>
    <circle cx="55" cy="18" r="4" fill="#c62828" opacity="0.3"/>
  </g>

  <!-- Center text area -->
  <g transform="translate(460, 100)">
    <text x="0" y="0" fill="#1a5632" font-size="28" font-weight="bold" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">Stack Checker</text>
    <text x="0" y="35" fill="#5d4e37" font-size="15" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">¿Tus suplementos son compatibles?</text>
    <line x1="-80" y1="52" x2="80" y2="52" stroke="#c4956a" stroke-width="1" opacity="0.5"/>
    <text x="0" y="75" fill="#8b7355" font-size="11" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">78 suplementos · 102 interacciones · Evidencia clínica</text>
  </g>

  <!-- Bottom decorative border -->
  <rect x="0" y="310" width="1024" height="10" fill="#1a5632" opacity="0.15"/>
</svg>