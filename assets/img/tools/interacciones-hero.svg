<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1024 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Verificador de Interacciones Plantas Medicinales - Medicamentos">
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#ede4d4"/>
    </linearGradient>
    <linearGradient id="ileaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#388e3c"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="ipill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <filter id="ishadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="320" fill="url(#ibg)"/>

  <!-- Grid pattern (scientific paper feel) -->
  <g opacity="0.04">
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#5d4e37" stroke-width="0.5"/>
    </pattern>
    <rect width="1024" height="320" fill="url(#grid)"/>
  </g>

  <!-- Left: Medicinal plant illustration -->
  <g transform="translate(60, 30)" filter="url(#ishadow)">
    <!-- Main stem -->
    <path d="M70,260 Q68,200 65,140 Q62,80 70,30" stroke="#5d4e37" stroke-width="2" fill="none"/>

    <!-- Large leaf pair -->
    <path d="M65,180 Q30,165 15,140 Q5,120 15,115 Q30,110 50,130 Q60,145 65,165" fill="url(#ileaf)" opacity="0.85"/>
    <path d="M65,180 Q40,165 25,145" stroke="#1b5e20" stroke-width="0.8" fill="none" opacity="0.4"/>
    <path d="M75,175 Q100,160 120,140 Q130,125 120,120 Q105,118 90,135 Q80,150 75,165" fill="#43a047" opacity="0.75"/>
    <path d="M75,175 Q100,160 115,140" stroke="#2e7d32" stroke-width="0.8" fill="none" opacity="0.4"/>

    <!-- Upper leaf pair -->
    <path d="M67,110 Q40,100 30,80 Q25,65 35,63 Q48,62 58,78 Q63,90 67,105" fill="url(#ileaf)" opacity="0.7"/>
    <path d="M73,105 Q95,92 108,75 Q115,62 105,60 Q95,60 85,75 Q78,88 73,100" fill="#43a047" opacity="0.65"/>

    <!-- Flower at top -->
    <circle cx="70" cy="25" r="8" fill="#ffb74d" opacity="0.7"/>
    <circle cx="70" cy="25" r="4" fill="#ff9800" opacity="0.8"/>
    <g opacity="0.5">
      <ellipse cx="62" cy="20" rx="5" ry="3" fill="#fff59d" transform="rotate(-30,62,20)"/>
      <ellipse cx="78" cy="20" rx="5" ry="3" fill="#fff59d" transform="rotate(30,78,20)"/>
      <ellipse cx="65" cy="32" rx="5" ry="3" fill="#fff59d" transform="rotate(20,65,32)"/>
      <ellipse cx="75" cy="32" rx="5" ry="3" fill="#fff59d" transform="rotate(-20,75,32)"/>
    </g>

    <!-- Root system -->
    <g opacity="0.4">
      <path d="M70,260 Q60,275 50,285" stroke="#8b7355" stroke-width="1.5" fill="none"/>
      <path d="M70,260 Q75,278 85,288" stroke="#8b7355" stroke-width="1" fill="none"/>
      <path d="M70,260 Q65,280 60,290" stroke="#8b7355" stroke-width="0.8" fill="none"/>
    </g>
  </g>

  <!-- Center: Interaction diagram -->
  <g transform="translate(420, 95)">
    <!-- Plant circle -->
    <circle cx="-60" cy="60" r="45" fill="#e8f5e9" stroke="#2e7d4f" stroke-width="2"/>
    <text x="-60" y="55" text-anchor="middle" fill="#1a5632" font-size="10" font-family="Georgia, serif" font-weight="bold">Planta</text>
    <text x="-60" y="70" text-anchor="middle" fill="#2e7d4f" font-size="9" font-family="Georgia, serif">150 especies</text>
    <!-- Small leaf icon -->
    <path d="M-68,35 Q-60,28 -52,35 Q-55,42 -60,45 Q-65,42 -68,35Z" fill="#4caf50" opacity="0.6"/>

    <!-- Medicine circle -->
    <circle cx="60" cy="60" r="45" fill="url(#ipill)" stroke="#1565c0" stroke-width="2"/>
    <text x="60" y="55" text-anchor="middle" fill="#0d47a1" font-size="10" font-family="Georgia, serif" font-weight="bold">Medicamento</text>
    <text x="60" y="70" text-anchor="middle" fill="#1565c0" font-size="9" font-family="Georgia, serif">30 clases</text>
    <!-- Small pill icon -->
    <rect x="52" y="30" width="16" height="8" rx="4" fill="#1565c0" opacity="0.4"/>

    <!-- Interaction arrows -->
    <path d="M-12,45 L12,45" stroke="#c62828" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M12,75 L-12,75" stroke="#e65100" stroke-width="2.5" marker-end="url(#arrow2)"/>

    <!-- Arrow markers -->
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="#c62828"/>
      </marker>
      <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="#e65100"/>
      </marker>
    </defs>

    <!-- Interaction count badge -->
    <circle cx="0" cy="60" r="18" fill="#1a5632"/>
    <text x="0" y="57" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold" font-family="Georgia, serif">503</text>
    <text x="0" y="69" text-anchor="middle" fill="#e8f5e9" font-size="7" font-family="Georgia, serif">interacciones</text>
  </g>

  <!-- Right: Decorative mortar and pestle silhouette -->
  <g transform="translate(800, 80)" opacity="0.5">
    <!-- Mortar -->
    <path d="M0,120 Q0,160 20,170 Q40,180 60,180 Q80,180 100,170 Q120,160 120,120 L115,80 Q100,70 60,65 Q20,70 5,80 Z" fill="#8b7355" opacity="0.3"/>
    <ellipse cx="60" cy="75" rx="57" ry="12" fill="#a0896a" opacity="0.3"/>
    <!-- Pestle -->
    <path d="M45,70 Q35,40 30,10 Q28,0 35,0 Q42,0 40,10 Q38,30 50,65" fill="#8b7355" opacity="0.4"/>
    <!-- Herbs in mortar -->
    <circle cx="40" cy="100" r="6" fill="#4caf50" opacity="0.4"/>
    <circle cx="55" cy="95" r="5" fill="#66bb6a" opacity="0.3"/>
    <circle cx="70" cy="102" r="7" fill="#388e3c" opacity="0.35"/>
    <circle cx="80" cy="95" r="4" fill="#81c784" opacity="0.3"/>
  </g>

  <!-- Title text -->
  <g transform="translate(512, 20)">
    <text x="0" y="0" fill="#1a5632" font-size="24" font-weight="bold" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">Verificador de Interacciones</text>
    <text x="0" y="28" fill="#5d4e37" font-size="14" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">Plantas Medicinales × Medicamentos</text>
    <line x1="-90" y1="42" x2="90" y2="42" stroke="#c4956a" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Bottom: Severity legend -->
  <g transform="translate(350, 270)">
    <circle cx="0" cy="0" r="6" fill="#c62828"/>
    <text x="12" y="4" fill="#5d4e37" font-size="10" font-family="Georgia, serif">Alta</text>
    <circle cx="70" cy="0" r="6" fill="#e65100"/>
    <text x="82" y="4" fill="#5d4e37" font-size="10" font-family="Georgia, serif">Moderada</text>
    <circle cx="170" cy="0" r="6" fill="#1565c0"/>
    <text x="182" y="4" fill="#5d4e37" font-size="10" font-family="Georgia, serif">Baja</text>
    <circle cx="240" cy="0" r="6" fill="#2e7d4f"/>
    <text x="252" y="4" fill="#5d4e37" font-size="10" font-family="Georgia, serif">Segura</text>
  </g>

  <!-- Bottom border -->
  <rect x="0" y="310" width="1024" height="10" fill="#1a5632" opacity="0.15"/>
</svg>